<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>材料管理 - 工地管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
            color: #333;
        }
        .btn-back {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }
        .stat-unit {
            font-size: 14px;
            color: #999;
            margin-left: 4px;
        }
        .action-bar {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .filter-select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        .material-list {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .material-table {
            width: 100%;
            border-collapse: collapse;
        }
        .material-table th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }
        .material-table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .material-table tr:hover {
            background: #f9f9f9;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-planned { background: #fff4e5; color: #ff9800; }
        .status-ordered { background: #e3f2fd; color: #2196f3; }
        .status-received { background: #e8f5e9; color: #4caf50; }
        .status-partial { background: #fff3e0; color: #ff9800; }
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 4px;
        }
        .btn-receive { background: #4caf50; color: white; }
        .btn-edit { background: #2196f3; color: white; }
        .btn-delete { background: #f44336; color: white; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .btn-cancel {
            padding: 10px 20px;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 材料管理</h1>
        <button class="btn-back" onclick="goBack()">← 返回项目</button>
    </div>

    <div class="container">
        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">📋 计划材料</div>
                <div class="stat-value" id="totalPlanned">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">✅ 已到货</div>
                <div class="stat-value" id="totalReceived">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🚚 待到货</div>
                <div class="stat-value" id="totalPending">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">💰 材料费用</div>
                <div class="stat-value">¥<span id="totalCost">0</span></div>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="action-bar">
            <button class="btn-primary" onclick="showAddMaterialModal()">+ 添加材料需求</button>
            <div class="filter-group">
                <label>状态筛选：</label>
                <select class="filter-select" id="statusFilter" onchange="filterMaterials()">
                    <option value="all">全部</option>
                    <option value="planned">计划中</option>
                    <option value="ordered">已下单</option>
                    <option value="partial">部分到货</option>
                    <option value="received">已到货</option>
                </select>
            </div>
        </div>

        <!-- 材料列表 -->
        <div class="material-list">
            <table class="material-table">
                <thead>
                    <tr>
                        <th>材料名称</th>
                        <th>计划数量</th>
                        <th>已到货</th>
                        <th>完成率</th>
                        <th>单价</th>
                        <th>总价</th>
                        <th>计划日期</th>
                        <th>供应商</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="materialTableBody">
                    <tr><td colspan="10" style="text-align: center; padding: 40px; color: #999;">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 添加材料模态框 -->
    <div class="modal" id="addMaterialModal">
        <div class="modal-content">
            <div class="modal-header">添加材料需求</div>
            <form id="addMaterialForm">
                <div class="form-group">
                    <label>选择材料 *</label>
                    <select id="materialSelect" required>
                        <option value="">请选择...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>计划数量 *</label>
                    <input type="number" id="plannedQuantity" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>单位</label>
                    <input type="text" id="unit" readonly>
                </div>
                <div class="form-group">
                    <label>单价（元）</label>
                    <input type="number" id="unitPrice" step="0.01">
                </div>
                <div class="form-group">
                    <label>计划到货日期</label>
                    <input type="date" id="plannedDate">
                </div>
                <div class="form-group">
                    <label>供应商</label>
                    <input type="text" id="supplier" placeholder="供应商名称">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="notes" rows="3" placeholder="其他说明..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeAddMaterialModal()">取消</button>
                    <button type="submit" class="btn-primary">确定添加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 到货登记模态框 -->
    <div class="modal" id="receiveModal">
        <div class="modal-content">
            <div class="modal-header">到货登记</div>
            <form id="receiveForm">
                <input type="hidden" id="receiveMaterialId">
                <div class="form-group">
                    <label>材料名称</label>
                    <input type="text" id="receiveMaterialName" readonly>
                </div>
                <div class="form-group">
                    <label>本次到货数量 *</label>
                    <input type="number" id="receiveQuantity" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>到货日期 *</label>
                    <input type="date" id="receiveDate" required>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="receiveNotes" rows="3" placeholder="质量情况、验收备注等..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeReceiveModal()">取消</button>
                    <button type="submit" class="btn-primary">确认到货</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        const token = localStorage.getItem('token');
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        
        let allMaterials = [];
        let materialLibrary = [];

        if (!token || !projectId) {
            window.location.href = '/index.html';
        }

        // 加载数据
        async function loadData() {
            try {
                // 加载材料库
                const libResponse = await fetch(`${API_BASE}/materials/library`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const libData = await libResponse.json();
                if (libData.success) {
                    materialLibrary = libData.data;
                    populateMaterialSelect();
                }

                // 加载项目材料
                const response = await fetch(`${API_BASE}/projects/${projectId}/materials`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    allMaterials = data.data;
                    displayMaterials(allMaterials);
                    updateStats();
                }
            } catch (error) {
                alert('加载失败：' + error.message);
            }
        }

        function populateMaterialSelect() {
            const select = document.getElementById('materialSelect');
            materialLibrary.forEach(mat => {
                const option = document.createElement('option');
                option.value = mat.id;
                option.textContent = `${mat.material_name} (${mat.unit})`;
                option.dataset.unit = mat.unit;
                option.dataset.price = mat.standard_price;
                select.appendChild(option);
            });
            
            select.addEventListener('change', (e) => {
                const selected = e.target.selectedOptions[0];
                if (selected) {
                    document.getElementById('unit').value = selected.dataset.unit || '';
                    document.getElementById('unitPrice').value = selected.dataset.price || '';
                }
            });
        }

        function displayMaterials(materials) {
            const tbody = document.getElementById('materialTableBody');
            if (materials.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 40px; color: #999;">暂无材料数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = materials.map(mat => {
                const percentage = mat.planned_quantity > 0 ? 
                    Math.round((mat.received_quantity / mat.planned_quantity) * 100) : 0;
                
                return `
                    <tr>
                        <td><strong>${mat.material_name}</strong></td>
                        <td>${mat.planned_quantity} ${mat.unit}</td>
                        <td>${mat.received_quantity || 0} ${mat.unit}</td>
                        <td>
                            <div>${percentage}%</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percentage}%"></div>
                            </div>
                        </td>
                        <td>¥${mat.unit_price || 0}</td>
                        <td>¥${mat.total_cost || 0}</td>
                        <td>${mat.planned_date || '-'}</td>
                        <td>${mat.supplier || '-'}</td>
                        <td><span class="status-badge status-${mat.status}">${getStatusText(mat.status)}</span></td>
                        <td>
                            <button class="btn-action btn-receive" onclick="showReceiveModal(${mat.id})">到货</button>
                            <button class="btn-action btn-delete" onclick="deleteMaterial(${mat.id})">删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getStatusText(status) {
            const map = {
                'planned': '计划中',
                'ordered': '已下单',
                'partial': '部分到货',
                'received': '已到货'
            };
            return map[status] || status;
        }

        function updateStats() {
            const planned = allMaterials.length;
            const received = allMaterials.filter(m => m.status === 'received').length;
            const pending = planned - received;
            const totalCost = allMaterials.reduce((sum, m) => sum + (parseFloat(m.total_cost) || 0), 0);
            
            document.getElementById('totalPlanned').textContent = planned;
            document.getElementById('totalReceived').textContent = received;
            document.getElementById('totalPending').textContent = pending;
            document.getElementById('totalCost').textContent = totalCost.toFixed(2);
        }

        function filterMaterials() {
            const status = document.getElementById('statusFilter').value;
            if (status === 'all') {
                displayMaterials(allMaterials);
            } else {
                const filtered = allMaterials.filter(m => m.status === status);
                displayMaterials(filtered);
            }
        }

        // 添加材料
        function showAddMaterialModal() {
            document.getElementById('addMaterialModal').style.display = 'flex';
            document.getElementById('addMaterialForm').reset();
        }

        function closeAddMaterialModal() {
            document.getElementById('addMaterialModal').style.display = 'none';
        }

        document.getElementById('addMaterialForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const materialId = document.getElementById('materialSelect').value;
            const selected = materialLibrary.find(m => m.id == materialId);
            
            const data = {
                material_id: materialId,
                material_name: selected.material_name,
                planned_quantity: parseFloat(document.getElementById('plannedQuantity').value),
                unit: document.getElementById('unit').value,
                unit_price: parseFloat(document.getElementById('unitPrice').value) || 0,
                planned_date: document.getElementById('plannedDate').value,
                supplier: document.getElementById('supplier').value,
                notes: document.getElementById('notes').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/projects/${projectId}/materials`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('添加成功！');
                    closeAddMaterialModal();
                    loadData();
                } else {
                    alert('添加失败：' + result.message);
                }
            } catch (error) {
                alert('添加失败：' + error.message);
            }
        });

        // 到货登记
        function showReceiveModal(materialId) {
            const material = allMaterials.find(m => m.id === materialId);
            if (!material) return;
            
            document.getElementById('receiveMaterialId').value = materialId;
            document.getElementById('receiveMaterialName').value = material.material_name;
            document.getElementById('receiveDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('receiveModal').style.display = 'flex';
        }

        function closeReceiveModal() {
            document.getElementById('receiveModal').style.display = 'none';
            document.getElementById('receiveForm').reset();
        }

        document.getElementById('receiveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const materialId = document.getElementById('receiveMaterialId').value;
            const data = {
                quantity: parseFloat(document.getElementById('receiveQuantity').value),
                receive_date: document.getElementById('receiveDate').value,
                notes: document.getElementById('receiveNotes').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/materials/${materialId}/receive`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('到货登记成功！');
                    closeReceiveModal();
                    loadData();
                } else {
                    alert('登记失败：' + result.message);
                }
            } catch (error) {
                alert('登记失败：' + error.message);
            }
        });

        async function deleteMaterial(materialId) {
            if (!confirm('确定要删除这条材料记录吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/materials/${materialId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('删除成功！');
                    loadData();
                } else {
                    alert('删除失败：' + result.message);
                }
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }

        function goBack() {
            window.location.href = `/project-detail.html?id=${projectId}`;
        }

        // 初始化
        loadData();
    </script>
</body>
</html>
