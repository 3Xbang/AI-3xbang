<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鏂藉伐绠＄悊绯荤粺 | Construction Management</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/process-colors.css">
    <link rel="stylesheet" href="css/daily-tasks.css">
    <link rel="stylesheet" href="css/photo-manager.css">
    <link rel="stylesheet" href="css/material-manager.css">
    <link rel="stylesheet" href="css/user-manager.css">
</head>
<body>
    <!-- 鐧诲綍椤甸潰 -->
    <div id="login-page" class="page active">
        <div class="login-container">
            <div class="logo">
                <h1 data-i18n="app.title">鏂藉伐绠＄悊绯荤粺</h1>
                <p data-i18n="app.subtitle">Construction Management</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label data-i18n="login.username">鐢ㄦ埛鍚?/label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label data-i18n="login.password">瀵嗙爜</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary" data-i18n="login.submit">鐧诲綍</button>
                <div id="login-error" class="error-message"></div>
            </form>
            <div class="language-switch">
                <button onclick="app.setLanguage('zh')" class="lang-btn">涓枃</button>
                <button onclick="app.setLanguage('th')" class="lang-btn">喙勦笚喔?/button>
            </div>
        </div>
    </div>

    <!-- 涓婚〉闈?-->
    <div id="main-page" class="page">
        <!-- 椤堕儴瀵艰埅 -->
        <header class="header">
            <div class="header-left">
                <h2 data-i18n="app.title">鏂藉伐绠＄悊绯荤粺</h2>
            </div>
            <div class="header-right">
                <span id="user-name"></span>
                <button onclick="app.setLanguage('zh')" class="lang-btn-small">涓?/button>
                <button onclick="app.setLanguage('th')" class="lang-btn-small">喙勦笚喔?/button>
                <button onclick="app.logout()" class="btn-link" data-i18n="common.logout">閫€鍑?/button>
            </div>
        </header>

        <!-- 涓诲唴瀹瑰尯 -->
        <div class="main-container">
            <!-- 渚ц竟瀵艰埅 -->
            <nav class="sidebar">
                <ul>
                    <li><a href="#" onclick="app.showView('daily-tasks')" data-i18n="nav.dailyTasks">浠婃棩浠诲姟</a></li>
                    <li><a href="#" onclick="app.showView('projects')" data-i18n="nav.projects">椤圭洰绠＄悊</a></li>
                    <li><a href="#" onclick="app.showView('processes')" data-i18n="nav.processes">宸ュ簭杩涘害</a></li>
                    <li><a href="#" onclick="app.showView('materials')" data-i18n="nav.materials">鏉愭枡绠＄悊</a></li>
                    <li><a href="#" onclick="app.showView('photos')" data-i18n="nav.photos">现场照片</a></li>
                    <li id="nav-users" style="display: none;"><a href="#" onclick="app.showView('users')" data-i18n="nav.users">用户管理</a></li>
                </ul>
            </nav>

            <!-- 鍐呭鍖哄煙 -->
            <main class="content">
                <!-- 浠婃棩浠诲姟瑙嗗浘 -->
                <div id="daily-tasks-view" class="view active">
                    <div class="view-header">
                        <h3 data-i18n="daily.title">浠婃棩浠诲姟</h3>
                        <select id="daily-project-selector" onchange="app.loadDailyTasks(this.value)">
                            <option value="" data-i18n="projects.selectProject">閫夋嫨椤圭洰</option>
                        </select>
                    </div>
                    <div class="daily-date">
                        馃搮 <span id="today-date"></span>
                    </div>
                    <div id="daily-tasks-container">
                        <!-- 杩涜涓殑浠诲姟 -->
                        <div class="task-section">
                            <h4>馃數 <span data-i18n="daily.inProgress">杩涜涓?/span></h4>
                            <div id="tasks-in-progress"></div>
                        </div>
                        
                        <!-- 绛夊緟鏉愭枡 -->
                        <div class="task-section">
                            <h4>馃煛 <span data-i18n="daily.waitingMaterial">绛夊緟鏉愭枡</span></h4>
                            <div id="tasks-waiting-material"></div>
                        </div>
                        
                        <!-- 浠婃棩瀹屾垚 -->
                        <div class="task-section">
                            <h4>馃煝 <span data-i18n="daily.completed">浠婃棩瀹屾垚</span></h4>
                            <div id="tasks-completed"></div>
                        </div>
                    </div>
                </div>

                <!-- 椤圭洰鍒楄〃瑙嗗浘 -->
                <div id="projects-view" class="view">
                    <div class="view-header">
                        <h3 data-i18n="projects.title">椤圭洰绠＄悊</h3>
                        <button onclick="app.showProjectForm()" class="btn-primary" data-i18n="projects.add">+ 鏂板缓椤圭洰</button>
                    </div>
                    <div id="projects-list" class="card-grid"></div>
                </div>

                <!-- 宸ュ簭杩涘害瑙嗗浘 -->
                <div id="processes-view" class="view">
                    <div class="view-header">
                        <h3 data-i18n="processes.title">宸ュ簭杩涘害</h3>
                        <select id="project-selector" onchange="app.loadProcesses(this.value)">
                            <option value="" data-i18n="processes.selectProject">閫夋嫨椤圭洰</option>
                        </select>
                    </div>
                    <div id="processes-list" class="process-timeline"></div>
                </div>

                <!-- 材料管理视图 -->
                <div id="materials-view" class="view">
                    <div class="materials-toolbar">
                        <div class="toolbar-left">
                            <h3 data-i18n="materials.title">材料管理</h3>
                            <select id="filter-material-status">
                                <option value="">全部状态</option>
                                <option value="ordered">已订购</option>
                                <option value="arrived">已到货</option>
                                <option value="in-use">使用中</option>
                                <option value="depleted">已用完</option>
                            </select>
                        </div>
                        <div class="toolbar-right">
                            <button id="btn-refresh-materials" class="btn btn-secondary">
                                🔄 刷新
                            </button>
                            <button id="btn-purchase-material" class="btn btn-primary">
                                + 采购材料
                            </button>
                        </div>
                    </div>
                    <div id="materials-list"></div>
                </div>

                <!-- 现场照片视图 -->
                <div id="photos-view" class="view">
                    <div class="view-header">
                        <h3 data-i18n="photos.title">现场照片</h3>
                        <select id="photo-project-selector" onchange="app.loadPhotos(this.value)">
                            <option value="" data-i18n="photos.selectProject">选择项目</option>
                        </select>
                    </div>
                    <div id="photos-grid" class="photo-grid"></div>
                </div>

                <!-- 用户管理视图 -->
                <div id="users-view" class="view">
                    <div class="view-header">
                        <h3 data-i18n="users.title">用户管理</h3>
                        <button id="btn-add-user" class="btn btn-primary" onclick="userManager.showAddUserModal()">
                            + <span data-i18n="users.addUser">添加用户</span>
                        </button>
                    </div>
                    <div class="user-stats">
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="users.totalUsers">总用户数</div>
                            <div class="stat-value" id="stat-total-users">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="users.managers">管理者</div>
                            <div class="stat-value" id="stat-managers">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="users.purchasers">采购者</div>
                            <div class="stat-value" id="stat-purchasers">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="users.executors">执行者</div>
                            <div class="stat-value" id="stat-executors">0</div>
                        </div>
                    </div>
                    <div class="users-table-container">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th data-i18n="users.username">用户名</th>
                                    <th data-i18n="users.fullName">全名</th>
                                    <th data-i18n="users.role">角色</th>
                                    <th data-i18n="users.assignedProjects">分配项目</th>
                                    <th data-i18n="users.createdAt">创建时间</th>
                                    <th data-i18n="users.actions">操作</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <!-- 用户列表将动态插入 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 妯℃€佹瀹瑰櫒 -->
    <div id="modal-container"></div>

    <!-- 鍔犺浇鎻愮ず -->
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- JavaScript -->
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/subtask-templates.js"></script>
    <script src="js/process-enhancements.js"></script>
    <script src="js/quantities.js"></script>
    <script src="js/project-enhancements.js"></script>
    <script src="js/daily-tasks.js"></script>
    <script src="js/photo-manager.js"></script>
    <script src="js/material-manager.js"></script>
    <script src="js/user-manager.js"></script>
</body>
</html>
