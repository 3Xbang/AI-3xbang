<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Villa | Construction Project Management System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/project-dashboard.css">
    <link rel="stylesheet" href="css/project-detail.css">
    <link rel="stylesheet" href="css/process-colors.css">
    <link rel="stylesheet" href="css/process-manager.css">
    <link rel="stylesheet" href="css/process-cards-v2.css">
    <link rel="stylesheet" href="css/process-scheduling.css">
    <link rel="stylesheet" href="css/daily-tasks.css">
    <link rel="stylesheet" href="css/photo-manager.css">
    <link rel="stylesheet" href="css/material-manager.css">
    <link rel="stylesheet" href="css/user-manager.css">
    <link rel="stylesheet" href="css/project-members.css">
    <link rel="stylesheet" href="css/task-assignment.css">
    <link rel="stylesheet" href="css/site-board.css?v=33">
    <link rel="stylesheet" href="css/ui-v2.css?v=22">
    <link rel="stylesheet" href="css/mobile.css?v=6">
    <!-- CDN: ECharts + PapaParse for purchase audit -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <!-- CDN: Fabric.js for drawing annotation + PDF.js for PDF rendering -->
    <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
</head>
<body>
    <!-- 登录页面 -->
    <div id="login-page" class="page active">
        <div class="login-container">
            <div class="logo">
                <h1>Mira Villa</h1>
                <p>建筑项目管理系统 Construction Project Management System</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>用户名 Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>密码 Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary">登录 Login</button>
                <div id="login-error" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="main-page" class="page">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <h2>Mira Villa</h2>
            </div>
            <div class="header-right">
                <span id="user-name"></span>
                <button id="btn-user-mgmt" onclick="app.showView('users')" class="btn-link" style="display:none">👥 用户管理</button>
                <button onclick="app.logout()" class="btn-link">退出 Logout</button>
            </div>
        </header>

        <!-- 主内容区 -->
        <div class="main-container">
            <!-- 项目仪表盘视图 -->
            <div id="dashboard-view" class="view active">
                <div id="project-dashboard-container"></div>
            </div>

            <!-- 项目详情视图 -->
            <div id="project-detail-view" class="view">
                <div id="project-detail-container"></div>
            </div>

            <!-- 用户管理视图（仅管理员） -->
            <div id="users-view" class="view">
                <div class="td-head" style="padding:12px 16px;border-bottom:1px solid #e2e8f0">
                    <div>
                        <button class="sb-btn" onclick="app.showView('dashboard')" style="margin-bottom:4px">← 返回 Back</button>
                        <h2 class="td-title">👥 用户管理 <small class="td-th">Manage Users</small></h2>
                    </div>
                    <button class="sb-btn primary" onclick="userManager.showAdd()">➕ 添加用户 Add User</button>
                </div>
                <div id="user-mgmt-body" style="padding:16px;max-width:900px;margin:0 auto">
                    <div class="td-empty">加载中…</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态框容器 -->
    <div id="modal-container"></div>

    <!-- 加载提示 -->
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- JavaScript -->
    <script src="js/i18n.js?v=108"></script>
    <script src="js/permissions.js?v=105"></script>
    <script src="js/api.js?v=103"></script>
    <script src="js/project-dashboard.js?v=112"></script>
    <script src="js/project-detail.js?v=137"></script>
    <script src="js/process-manager.js?v=103"></script>
    <script src="js/process-scheduling.js?v=102"></script>
    <script src="js/app.js?v=107"></script>
    <script src="js/subtask-templates.js?v=102"></script>
    <script src="js/process-enhancements.js?v=110"></script>
    <script src="js/quantities.js?v=102"></script>
    <script src="js/project-enhancements.js?v=102"></script>
    <script src="js/daily-tasks.js?v=103"></script>
    <script src="js/photo-manager.js?v=117"></script>
    <script src="js/material-manager-simple.js?v=105"></script>
    <script src="js/user-manager.js?v=105"></script>
    <script src="js/project-members.js?v=105"></script>
    <script src="js/task-assignment.js?v=103"></script>
    <script src="js/gantt.js?v=4"></script>
    <script src="js/daily-assign.js?v=8"></script>
    <script src="js/daily-report.js?v=4"></script>
    <script src="js/site-board.js?v=40"></script>
    <script src="js/purchase-audit.js?v=13"></script>
    <script src="js/purchase-db.js?v=4"></script>
    <script src="js/project-prepare.js?v=6"></script>
    <script src="js/share-viewer.js?v=7"></script>
    <script src="js/design-drawings.js?v=19"></script>
    <script src="js/maintenance.js?v=4"></script>
</body>
</html>
