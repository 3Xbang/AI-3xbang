<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Villa | ระบบจัดการโครงการก่อสร้าง</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/project-dashboard.css">
    <link rel="stylesheet" href="css/project-detail.css">
    <link rel="stylesheet" href="css/process-colors.css">
    <link rel="stylesheet" href="css/process-manager.css">
    <link rel="stylesheet" href="css/process-cards-v2.css">
    <link rel="stylesheet" href="css/process-scheduling.css">
    <link rel="stylesheet" href="css/daily-tasks.css">
    <link rel="stylesheet" href="css/photo-manager.css">
    <link rel="stylesheet" href="css/material-manager.css">
    <link rel="stylesheet" href="css/user-manager.css">
    <link rel="stylesheet" href="css/project-members.css">
    <link rel="stylesheet" href="css/task-assignment.css">
</head>
<body>
    <!-- 登录页面 -->
    <div id="login-page" class="page active">
        <div class="login-container">
            <div class="logo">
                <h1>Mira Villa</h1>
                <p>建筑项目管理系统 ระบบจัดการโครงการก่อสร้าง</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>用户名 ชื่อผู้ใช้</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>密码 รหัสผ่าน</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary">登录 เข้าสู่ระบบ</button>
                <div id="login-error" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="main-page" class="page">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <h2>Mira Villa</h2>
            </div>
            <div class="header-right">
                <span id="user-name"></span>
                <button onclick="app.logout()" class="btn-link">退出 ออกจากระบบ</button>
            </div>
        </header>

        <!-- 主内容区 -->
        <div class="main-container">
            <!-- 项目仪表盘视图 -->
            <div id="dashboard-view" class="view active">
                <div id="project-dashboard-container"></div>
            </div>

            <!-- 项目详情视图 -->
            <div id="project-detail-view" class="view">
                <div id="project-detail-container"></div>
            </div>

            <!-- 用户管理视图（仅管理员） -->
            <div id="users-view" class="view">
                <div class="view-header">
                    <button class="btn-back" onclick="app.showView('dashboard')">
                        <span>←</span> <span>返回 กลับ</span>
                    </button>
                    <h3>用户管理 ผู้ใช้งาน</h3>
                    <button id="btn-add-user" class="btn btn-primary" onclick="userManager.showAddUserModal()">
                        + <span>添加用户 เพิ่มผู้ใช้</span>
                    </button>
                </div>
                <div class="user-stats">
                    <div class="stat-card">
                        <div class="stat-label">总用户数 จำนวนผู้ใช้ทั้งหมด</div>
                        <div class="stat-value" id="stat-total-users">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">管理者 ผู้จัดการ</div>
                        <div class="stat-value" id="stat-managers">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">采购者 ผู้จัดซื้อ</div>
                        <div class="stat-value" id="stat-purchasers">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">执行者 ผู้ปฏิบัติงาน</div>
                        <div class="stat-value" id="stat-executors">0</div>
                    </div>
                </div>
                <div class="users-table-container">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>用户名 ชื่อผู้ใช้</th>
                                <th>全名 ชื่อเต็ม</th>
                                <th>角色 บทบาท</th>
                                <th>分配项目 โครงการที่มอบหมาย</th>
                                <th>创建时间 วันที่สร้าง</th>
                                <th>操作 การดำเนินการ</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- 用户列表将动态插入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态框容器 -->
    <div id="modal-container"></div>

    <!-- 加载提示 -->
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- JavaScript -->
    <script src="js/i18n.js?v=104"></script>
    <script src="js/permissions.js?v=102"></script>
    <script src="js/api.js?v=102"></script>
    <script src="js/project-dashboard.js?v=102"></script>
    <script src="js/project-detail.js?v=102"></script>
    <script src="js/process-manager.js?v=102"></script>
    <script src="js/process-scheduling.js?v=102"></script>
    <script src="js/app.js?v=102"></script>
    <script src="js/subtask-templates.js?v=102"></script>
    <script src="js/process-enhancements.js?v=104"></script>
    <script src="js/quantities.js?v=102"></script>
    <script src="js/project-enhancements.js?v=102"></script>
    <script src="js/daily-tasks.js?v=102"></script>
    <script src="js/photo-manager.js?v=102"></script>
    <script src="js/material-manager-simple.js?v=102"></script>
    <script src="js/user-manager.js?v=102"></script>
    <script src="js/project-members.js?v=102"></script>
    <script src="js/task-assignment.js?v=102"></script>
</body>
</html>
