<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Villa | ระบบจัดการโครงการก่อสร้าง</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/project-dashboard.css">
    <link rel="stylesheet" href="css/project-detail.css">
    <link rel="stylesheet" href="css/process-colors.css">
    <link rel="stylesheet" href="css/daily-tasks.css">
    <link rel="stylesheet" href="css/photo-manager.css">
    <link rel="stylesheet" href="css/material-manager.css">
    <link rel="stylesheet" href="css/user-manager.css">
    <link rel="stylesheet" href="css/project-members.css">
    <link rel="stylesheet" href="css/task-assignment.css">
</head>
<body>
    <!-- 登录页面 -->
    <div id="login-page" class="page active">
        <div class="login-container">
            <div class="logo">
                <h1 data-i18n="app.title">Mira Villa</h1>
                <p data-i18n="app.subtitle">ระบบจัดการโครงการก่อสร้าง</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label data-i18n="login.username">用户名</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label data-i18n="login.password">密码</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary" data-i18n="login.submit">登录</button>
                <div id="login-error" class="error-message"></div>
            </form>
            <div class="language-switch">
                <button onclick="app.setLanguage('zh')" class="lang-btn">中文</button>
                <button onclick="app.setLanguage('th')" class="lang-btn">ภาษาไทย</button>
            </div>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="main-page" class="page">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <h2 data-i18n="app.title">Mira Villa</h2>
            </div>
            <div class="header-right">
                <span id="user-name"></span>
                <button onclick="app.setLanguage('zh')" class="lang-btn-small">中</button>
                <button onclick="app.setLanguage('th')" class="lang-btn-small">ไทย</button>
                <button onclick="app.logout()" class="btn-link" data-i18n="common.logout">退出</button>
            </div>
        </header>

        <!-- 主内容区 -->
        <div class="main-container">
            <!-- 项目仪表盘视图 -->
            <div id="dashboard-view" class="view active">
                <div id="project-dashboard-container"></div>
            </div>

            <!-- 项目详情视图 -->
            <div id="project-detail-view" class="view">
                <div id="project-detail-container"></div>
            </div>

            <!-- 用户管理视图（仅管理员） -->
            <div id="users-view" class="view">
                <div class="view-header">
                    <button class="btn-back" onclick="app.showView('dashboard')">
                        <span>←</span> <span data-i18n="common.back">返回</span>
                    </button>
                    <h3 data-i18n="users.title">用户管理</h3>
                    <button id="btn-add-user" class="btn btn-primary" onclick="userManager.showAddUserModal()">
                        + <span data-i18n="users.addUser">添加用户</span>
                    </button>
                </div>
                    <div class="user-stats">
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="users.totalUsers">总用户数</div>
                            <div class="stat-value" id="stat-total-users">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="users.managers">管理者</div>
                            <div class="stat-value" id="stat-managers">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="users.purchasers">采购者</div>
                            <div class="stat-value" id="stat-purchasers">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="users.executors">执行者</div>
                            <div class="stat-value" id="stat-executors">0</div>
                        </div>
                    </div>
                    <div class="users-table-container">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th data-i18n="users.username">用户名</th>
                                    <th data-i18n="users.fullName">全名</th>
                                    <th data-i18n="users.role">角色</th>
                                    <th data-i18n="users.assignedProjects">分配项目</th>
                                    <th data-i18n="users.createdAt">创建时间</th>
                                    <th data-i18n="users.actions">操作</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <!-- 用户列表将动态插入 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 模态框容器 -->
    <div id="modal-container"></div>

    <!-- 加载提示 -->
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- JavaScript -->
    <script src="js/i18n.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/api.js"></script>
    <script src="js/project-dashboard.js"></script>
    <script src="js/project-detail.js"></script>
    <script src="js/app.js"></script>
    <script src="js/subtask-templates.js"></script>
    <script src="js/process-enhancements.js"></script>
    <script src="js/quantities.js"></script>
    <script src="js/project-enhancements.js"></script>
    <script src="js/daily-tasks.js"></script>
    <script src="js/photo-manager.js"></script>
    <script src="js/material-manager.js"></script>
    <script src="js/user-manager.js"></script>
    <script src="js/project-members.js"></script>
    <script src="js/task-assignment.js"></script>
</body>
</html>
